<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html,body{margin:0;background:#120800;width:100%;height:100%;overflow:hidden;}
    canvas{position:fixed;top:0;left:0;right:0;bottom:0;margin:auto;display:block;}
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540"></canvas>
  <script>
    window.addEventListener('load', function() {
      var c = document.getElementById('c');
      var ctx = c.getContext('2d');
      var w = window.innerWidth || 320;
      var h = window.innerHeight || 480;
      var s = Math.min(w/960, h/540);
      c.style.width  = Math.floor(960*s)+'px';
      c.style.height = Math.floor(540*s)+'px';
      ctx.fillStyle = '#3A1A00';
      ctx.fillRect(0,0,960,540);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 60px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('iOS OK !', 480, 240);
      ctx.fillStyle = '#FF4444';
      ctx.font = '30px Arial';
      ctx.fillText('w='+w+' h='+h+' s='+s.toFixed(2), 480, 310);
    });
  </script>
</body>
</html>
