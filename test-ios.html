<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { margin:0; background:red; color:white; font:22px Arial; padding:20px; }
    canvas { display:block; border:4px solid yellow; margin-top:12px; }
  </style>
</head>
<body>
  <p id="t1" style="background:#006;padding:8px;">1. HTML charge</p>
  <p id="t2" style="background:#060;padding:8px;">2. JS pas encore lancé</p>
  <canvas id="c" width="400" height="120"></canvas>

  <script>
    // PAS de window.load — script en bas de body, après le canvas
    document.getElementById('t2').textContent =
      '2. JS OK — ' + window.innerWidth + 'x' + window.innerHeight;
    try {
      var ctx = document.getElementById('c').getContext('2d');
      if (!ctx) throw new Error('getContext retourne null');
      ctx.fillStyle = '#0044cc';
      ctx.fillRect(0, 0, 400, 120);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('3. CANVAS OK', 60, 70);
    } catch(e) {
      document.getElementById('t2').textContent += ' | ERREUR: ' + e.message;
    }
  </script>
</body>
</html>
